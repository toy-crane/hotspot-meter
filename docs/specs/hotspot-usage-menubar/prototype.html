<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>DataUsage 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: no design system yet; macOS light appearance ── */
  :root {
    --background: #f6f6f6;
    --surface: rgba(246, 246, 246, 0.86);
    --foreground: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.1);
    --accent: #0a84ff;
    --success: #28a745;
    --menubar: rgba(246, 246, 246, 0.72);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  /* ── product: desktop, menu bar, panel ── */
  .desktop {
    position: relative; height: 560px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(160deg, #6a8caf 0%, #a7b7c9 45%, #d8c3a5 100%);
    font-family: var(--font); color: var(--foreground);
  }
  .menubar {
    height: 26px; display: flex; align-items: center; gap: 2px; padding: 0 8px;
    background: var(--menubar); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    font-size: 13px;
  }
  .menubar .left { display: flex; gap: 16px; align-items: center; padding-left: 6px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap }
  .menubar .left b { font-weight: 700 }
  .menubar .right { display: flex; gap: 4px; align-items: center; white-space: nowrap }
  .mb-item {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px;
    border-radius: 5px; border: 0; background: none; font: inherit; color: inherit; cursor: default;
  }
  .mb-item.app { cursor: pointer }
  .mb-item.app:hover, .mb-item.app.open { background: rgba(0, 0, 0, 0.1) }
  .mb-item.app .num { font-variant-numeric: tabular-nums }
  .mb-item.app.off { color: var(--muted) }
  .mb-item svg { width: 16px; height: 16px; display: block }

  .panel {
    position: absolute; top: 32px; width: 280px; padding: 16px;
    background: var(--surface); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 0.5px solid rgba(0, 0, 0, 0.18); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    font-size: 13px;
  }
  .divider { height: 0.5px; background: var(--line); margin: 14px 0 12px }
  .usage .head { display: flex; align-items: center; justify-content: space-between; gap: 8px }
  .usage .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1 }
  .usage .since { font-size: 12px; color: var(--muted); margin-bottom: 2px; cursor: default }
  .status {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
  .status.on { color: var(--success); background: rgba(40, 167, 69, 0.12) }
  .status.off { color: var(--muted); background: rgba(0, 0, 0, 0.06) }
  .actions { display: flex; justify-content: space-between }
  .btn {
    font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 6px; cursor: pointer;
    background: #fff; color: var(--foreground);
    border: 0.5px solid rgba(0, 0, 0, 0.2); box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.12);
  }
  .btn:active { background: #e8e8e8 }

  .alert {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 240px;
    padding: 16px; text-align: center; word-break: keep-all;
    background: rgba(246, 246, 246, 0.94); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 0.5px solid rgba(0, 0, 0, 0.18); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25); font-size: 13px;
  }
  .alert h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600 }
  .alert p { margin: 0 0 14px; font-size: 11px; color: var(--muted) }
  .alert .buttons { display: flex; gap: 8px }
  .alert .buttons .btn { flex: 1 }
  .alert .btn.primary { background: var(--accent); color: #fff; border-color: transparent }

  .desk-icon {
    position: absolute; left: 24px; top: 52px; width: 84px; text-align: center;
    font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); cursor: default; user-select: none;
  }
  .desk-icon .glyph {
    width: 56px; height: 56px; margin: 0 auto 4px; border-radius: 13px;
    background: linear-gradient(180deg, #4aa3ff, #0a6cff); display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }
  .desk-icon .glyph svg { width: 32px; height: 32px; color: #fff }
  .desk-icon.selected .label { background: rgba(10, 132, 255, 0.85); border-radius: 4px; padding: 0 4px; text-shadow: none }


  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }
</style>

<header class="sh-bar">

  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>

    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>

<main class="sh-stage">
  <section data-screen="menubar" data-title="메뉴바 창" data-states="미연결">
    <div class="desktop" data-component="new:Desktop">
      <div class="menubar" data-component="new:MenuBar">
        <div class="left">
          <span aria-hidden="true">&#63743;</span>
          <b>Xcode</b><span>파일</span><span>편집</span><span>보기</span><span>탐색</span><span>윈도우</span>

        <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9" stroke-linecap="round"/>
      </symbol>

        <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9" stroke-linecap="round"/>

</main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

<script>
  // ── product behavior (dummy data only) ──
  const $ = id => document.getElementById(id);
  const desktop = document.querySelector('.desktop');
  const appItem = $('mb-app'), panel = $('panel'), deskIcon = $('desk-icon');
  const NOW = new Date(2026, 9, 29, 14, 7);
  const startedAt = Date.now();

  const PRESETS = { 'Default': 'usb', '미연결': null };
  let app;

  function init(name) {
    app = {
      running: true, open: true, link: name in PRESETS ? PRESETS[name] : 'usb',
      total: { r: 1621904118, s: 254587300 },
      since: new Date(2026, 9, 27, 21, 14),
    };
    deskIcon.classList.remove('selected');
    $('reset-alert').hidden = true;
    render();
  }

  function fmt(bytes) {
    if (bytes === 0) return '0 KB';
    if (bytes < 1e3) return bytes + ' bytes';
    if (bytes < 1e6) return Math.round(bytes / 1e3) + ' KB';
    if (bytes < 1e9) return (bytes / 1e6).toFixed(1) + ' MB';
    return (bytes / 1e9).toFixed(2) + ' GB';
  }
  function fmtDate(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일` }
  function fmtDateTime(d) {
    const h = d.getHours(), ampm = h < 12 ? '오전' : '오후', h12 = h % 12 || 12;
    return `${fmtDate(d)} ${ampm} ${h12}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  function now() { return new Date(NOW.getTime() + (Date.now() - startedAt)); }


  function render() {
    const on = !!app.link;
    appItem.hidden = !app.running;
    deskIcon.hidden = app.running;
    appItem.classList.toggle('off', !on);
    appItem.classList.toggle('open', app.open);
    appItem.querySelector('use').setAttribute('href', on ? '#ico-hotspot' : '#ico-hotspot-off');
    $('mb-num').textContent = fmt(app.total.r + app.total.s);

    panel.hidden = !(app.running && app.open);
    const status = $('status');
    status.className = 'status ' + (on ? 'on' : 'off');
    status.textContent = on ? '집계 중' : '핫스팟 아님';
    $('u-total').querySelector('.value').textContent = fmt(app.total.r + app.total.s);
    $('since').textContent = `${fmtDate(app.since)}부터`;
    $('since').title = fmtDateTime(app.since);

    if (!panel.hidden) {
      const d = desktop.getBoundingClientRect(), r = appItem.getBoundingClientRect();
      panel.style.left = Math.max(8, Math.min(r.left - d.left, d.width - 288)) + 'px';
    }
  }

  appItem.onclick = e => { e.stopPropagation(); app.open = !app.open; render(); };
  panel.onclick = e => e.stopPropagation();
  desktop.addEventListener('click', () => {
    deskIcon.classList.remove('selected');
    if (app.open) { app.open = false; render(); }
  });
  deskIcon.onclick = e => { e.stopPropagation(); deskIcon.classList.add('selected'); };
  deskIcon.ondblclick = () => {
    app.running = true; app.open = false;
    deskIcon.classList.remove('selected');
    render();
  };
  const alertBox = $('reset-alert');
  function closeAlert() { alertBox.hidden = true; }
  $('btn-reset').onclick = () => {
    $('reset-message').textContent =
      `${fmt(app.total.r + app.total.s)} 기록이 사라집니다.`;
    alertBox.hidden = false;
    $('alert-cancel').focus();
  };
  alertBox.onclick = e => e.stopPropagation();
  $('alert-cancel').onclick = closeAlert;
  $('alert-reset').onclick = () => {
    app.total = { r: 0, s: 0 }; app.since = now();
    closeAlert(); render();
  };
  addEventListener('keydown', e => { if (e.key === 'Escape' && !alertBox.hidden) closeAlert(); });
  $('btn-quit').onclick = () => { app.running = false; app.open = false; render(); };

  setInterval(() => {
    if (!app.running || !app.link) return;
    const r = 40e3 + Math.floor(Math.random() * 860e3), s = 5e3 + Math.floor(Math.random() * 115e3);
    app.total.r += r; app.total.s += s;
    render();
  }, 2000);

  stateSelect.addEventListener('change', () => init(stateSelect.value));
  addEventListener('resize', render);
  init(prototypeShell.getState());
</script>
